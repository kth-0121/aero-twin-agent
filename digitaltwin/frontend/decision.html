<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>의사결정 지원 | AERO Twin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --shell: #11191b; --panel: #192326; --panel-raised: #202d30; --line: #344346;
      --text: #e4edeb; --muted: #91a3a3; --quiet: #647777;
      --mint: #55d6b1; --cyan: #73c8dc; --amber: #e7b76b; --red: #f0776c;
      --mono: "IBM Plex Mono", "IBM Plex Sans KR", monospace; --sans: "IBM Plex Sans KR", "IBM Plex Sans", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 360px; background: var(--shell); color: var(--text); font: 13px var(--sans); }
    .topbar { display: flex; align-items: center; gap: 28px; height: 56px; padding: 0 22px; border-bottom: 1px solid var(--line); background: #151f21; }
    .brand { font-weight: 700; font-size: 13px; }
    .brand small { display: block; margin-top: 2px; color: var(--muted); font: 9px var(--mono); }
    .topbar a { color: #aab9b7; text-decoration: none; font-size: 12px; padding: 6px 10px; border: 1px solid transparent; }
    .topbar a:hover { color: var(--text); background: #1d292b; }
    .topbar a.on { border-color: #31544c; background: #1c302c; color: #dff8ef; }
    .conn { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--quiet); }
    .dot.on { background: var(--mint); box-shadow: 0 0 9px #55d6b177; }
    main { display: grid; gap: 14px; max-width: 1200px; margin: 0 auto; padding: 18px 22px 40px; }
    .panel { border: 1px solid var(--line); background: var(--panel); }
    .ph { display: flex; align-items: baseline; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .ph h2 { margin: 0; font-size: 13px; font-weight: 600; }
    .ph span { color: var(--muted); font-size: 11px; }
    .pb { padding: 14px 16px; }
    .live { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 1px; background: var(--line); }
    .live > div { padding: 10px 14px; background: var(--panel); }
    .live .k { color: var(--quiet); font: 9px var(--mono); text-transform: uppercase; }
    .live .v { margin-top: 4px; font: 600 16px var(--mono); }
    .live .v small { color: var(--muted); font-weight: 400; font-size: 10px; }
    .cols { display: grid; grid-template-columns: 340px 1fr; gap: 14px; align-items: start; }
    @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    button { font: inherit; color: var(--text); cursor: pointer; }
    .chip { padding: 6px 10px; border: 1px solid var(--line); background: var(--panel-raised); font-size: 11px; }
    .chip:hover { border-color: #4b8d7e; }
    .field { display: grid; grid-template-columns: 1fr 74px; gap: 4px 10px; align-items: center; margin-bottom: 11px; }
    .field label { color: var(--muted); font-size: 11px; }
    .field input[type=number] { width: 100%; padding: 4px 6px; border: 1px solid var(--line); background: #11191b; color: var(--text); font: 12px var(--mono); text-align: right; }
    .field input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--mint); }
    .run { width: 100%; margin-top: 4px; padding: 10px; border: 1px solid #4b8d7e; background: #1b3935; color: #dff8ef; font-weight: 600; }
    .run:hover { background: #21463f; }
    .run:disabled { opacity: .5; cursor: wait; }
    .badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; font-weight: 700; border: 1px solid; }
    .badge.normal { color: var(--mint); border-color: #31544c; background: #1c302c; }
    .badge.lof_risk { color: var(--amber); border-color: #68573b; background: #30291e; }
    .badge.keyhole_risk { color: var(--red); border-color: #6b3b37; background: #301d1b; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 14px 0; }
    .m { padding: 10px 12px; border: 1px solid var(--line); background: var(--panel-raised); }
    .m .k { color: var(--quiet); font: 9px var(--mono); }
    .m .v { margin-top: 4px; font: 600 15px var(--mono); }
    .note { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .warn { margin: 8px 0 0; padding: 8px 10px; border: 1px solid #68573b; background: #30291e; color: var(--amber); font-size: 12px; line-height: 1.5; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { padding: 8px 10px; border-bottom: 1px solid var(--line); color: var(--quiet); font: 500 10px var(--mono); text-align: left; }
    td { padding: 9px 10px; border-bottom: 1px solid #263235; }
    td.num { font-family: var(--mono); }
    tr.best td { background: #1c302c; }
    .ok { color: var(--mint); } .no { color: var(--red); }
    .empty { color: var(--quiet); padding: 18px 0; text-align: center; }
    .ask { display: flex; gap: 8px; }
    .ask input { flex: 1; padding: 8px 10px; border: 1px solid var(--line); background: #11191b; color: var(--text); font: 12px var(--sans); }
    .ask button { padding: 8px 16px; border: 1px solid var(--line); background: var(--panel-raised); }
    .answer { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line); background: var(--panel-raised); line-height: 1.6; white-space: pre-wrap; font-size: 12px; }
    .answer.err { color: var(--amber); border-color: #68573b; background: #30291e; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">AERO Twin<small>PHYSICAL AI DIGITAL TWIN</small></div>
    <a href="/">설비 모니터링</a>
    <a href="/decision" class="on">의사결정 지원</a>
    <div class="conn"><i id="dot" class="dot"></i><span id="conn">DT 스트림 연결 중</span></div>
  </header>

  <main>
    <section class="panel">
      <div class="ph"><h2>라이브 설비 조건</h2><span>DT 스트림(/ws/dt)에서 수신 · 시뮬레이션 피드</span></div>
      <div class="live">
        <div><div class="k">레이저 출력</div><div class="v" id="l-p">---<small> W</small></div></div>
        <div><div class="k">스캔 속도</div><div class="v" id="l-v">---<small> mm/s</small></div></div>
        <div><div class="k">예측 폭</div><div class="v" id="l-w">---<small> um</small></div></div>
        <div><div class="k">예측 깊이</div><div class="v" id="l-d">---<small> um</small></div></div>
        <div><div class="k">모델</div><div class="v" id="l-m" style="font-size:12px">---</div></div>
      </div>
      <div class="pb"><button class="chip" id="use-live" disabled>라이브 조건으로 판단하기</button></div>
    </section>

    <div class="cols">
      <section class="panel">
        <div class="ph"><h2>공정 조건</h2><span>시나리오 또는 직접 입력</span></div>
        <div class="pb">
          <div class="presets" id="presets"></div>
          <div id="fields"></div>
          <button class="run" id="run">판단 및 행동 추천 실행</button>
        </div>
      </section>

      <div style="display:grid;gap:14px">
        <section class="panel">
          <div class="ph"><h2>상태 판단</h2><span id="src">---</span></div>
          <div class="pb" id="result"><div class="empty">조건을 선택하고 실행하세요</div></div>
        </section>
        <section class="panel">
          <div class="ph"><h2>행동 후보 · 재검증</h2><span id="verif">---</span></div>
          <div class="pb" id="cands"><div class="empty">위험 상태일 때 후보가 생성됩니다</div></div>
        </section>
      </div>
    </div>

    <section class="panel">
      <div class="ph"><h2>Agent 질의</h2><span>로컬 sLLM (Ollama)</span></div>
      <div class="pb">
        <div class="ask"><input id="q" value="현재 조건에서 LOF 없이 안전하게 붙어?" /><button id="ask">질문</button></div>
        <div id="answer"></div>
      </div>
    </section>
  </main>

  <script>
    const FIELDS = [
      { key: "power_w", label: "레이저 출력 (W)", min: 50, max: 600, step: 5, value: 200 },
      { key: "speed_mm_s", label: "스캔 속도 (mm/s)", min: 100, max: 2000, step: 10, value: 800 },
      { key: "spot_diameter_um", label: "스폿 직경 (um)", min: 50, max: 200, step: 5, value: 100 },
      { key: "hatch_um", label: "해치 간격 (um)", min: 50, max: 200, step: 5, value: 100 },
      { key: "layer_thickness_um", label: "층 두께 (um)", min: 20, max: 100, step: 5, value: 30 },
    ];
    const STATUS_LABEL = { normal: "정상", lof_risk: "LOF 위험", keyhole_risk: "Keyhole 위험" };
    const $ = (id) => document.getElementById(id);

    function el(tag, props = {}, ...kids) {
      const node = Object.assign(document.createElement(tag), props);
      kids.flat().forEach((k) => node.append(k instanceof Node ? k : document.createTextNode(String(k))));
      return node;
    }

    // 입력 폼: 슬라이더와 숫자칸을 동기화
    const inputs = {};
    FIELDS.forEach((f) => {
      const num = el("input", { type: "number", min: f.min, max: f.max, step: f.step, value: f.value });
      const rng = el("input", { type: "range", min: f.min, max: f.max, step: f.step, value: f.value });
      num.oninput = () => (rng.value = num.value);
      rng.oninput = () => (num.value = rng.value);
      inputs[f.key] = num;
      $("fields").append(el("div", { className: "field" }, el("label", { textContent: f.label }), num, rng));
    });
    const setConditions = (c) => Object.entries(c).forEach(([k, v]) => {
      if (inputs[k]) { inputs[k].value = v; inputs[k].nextElementSibling.value = v; }
    });
    const readConditions = () => Object.fromEntries(Object.entries(inputs).map(([k, n]) => [k, Number(n.value)]));

    async function api(path, body) {
      const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : undefined);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail ? JSON.stringify(data.detail) : `HTTP ${res.status}`);
      return data;
    }

    function metric(k, v) { return el("div", { className: "m" }, el("div", { className: "k", textContent: k }), el("div", { className: "v", textContent: v })); }

    function renderResult(r) {
      const s = r.current_state;
      $("src").textContent = r.prediction_model;
      const box = $("result");
      box.replaceChildren(
        el("span", { className: `badge ${s.status}`, textContent: STATUS_LABEL[s.status] || s.status }),
        el("div", { className: "metrics" },
          metric("용융풀 폭", `${s.width_um} um`), metric("용융풀 깊이", `${s.depth_um} um`),
          metric("LOF 지표 (≤1 안전)", s.lof_criterion), metric("Regime", s.regime === "conduction" ? "conduction" : "keyhole/전이")),
        el("p", { className: "note", textContent: `판단: ${r.reason || r.recommended_action}` }),
        el("p", { className: "note", textContent: `불확실성: ${r.uncertainty}` }),
        ...(r.warnings || []).map((w) => el("div", { className: "warn", textContent: "⚠ " + w })),
      );
    }

    function renderCandidates(r) {
      $("verif").textContent = r.verification ? "ROM 기반 가상검증" : "---";
      const list = r.candidates_evaluated || [];
      if (!list.length) { $("cands").replaceChildren(el("div", { className: "empty", textContent: "현재 상태가 정상이라 행동 후보가 없습니다 (공정 유지)" })); return; }
      const head = el("tr", {}, ...["행동", "새 출력(W)", "새 속도(mm/s)", "재검증 결과", "LOF", "해소"].map((h) => el("th", { textContent: h })));
      const rows = list.map((c) => {
        const st = c.resulting_state;
        const tr = el("tr", { className: c.action === r.recommended_action ? "best" : "" },
          el("td", { textContent: c.action }), el("td", { className: "num", textContent: c.new_power_w }),
          el("td", { className: "num", textContent: c.new_speed_mm_s }), el("td", { textContent: STATUS_LABEL[st.status] || st.status }),
          el("td", { className: "num", textContent: st.lof_criterion }),
          el("td", { className: c.resolved ? "ok" : "no", textContent: c.resolved ? "✔ 해소" : "✖ 미해소" }));
        return tr;
      });
      $("cands").replaceChildren(el("table", {}, el("thead", {}, head), el("tbody", {}, rows)),
        el("p", { className: "note", textContent: `검증 방식: ${r.verification}. 강조된 행이 추천 행동입니다.` }));
    }

    async function run() {
      $("run").disabled = true;
      try {
        const r = await api("/api/recommend", readConditions());
        renderResult(r); renderCandidates(r);
      } catch (e) {
        $("result").replaceChildren(el("div", { className: "warn", textContent: "판단 실패: " + e.message }));
      } finally { $("run").disabled = false; }
    }
    $("run").onclick = run;

    api("/api/scenarios").then((list) => list.forEach((s) => {
      $("presets").append(el("button", { className: "chip", textContent: s.label, onclick: () => { setConditions({ power_w: s.power_w, speed_mm_s: s.speed_mm_s }); run(); } }));
    })).catch(() => {});

    $("ask").onclick = async () => {
      const box = $("answer");
      box.replaceChildren(el("div", { className: "answer", textContent: "Agent 응답 대기 중..." }));
      try { box.replaceChildren(el("div", { className: "answer", textContent: (await api("/api/agent", { question: $("q").value })).answer })); }
      catch (e) { box.replaceChildren(el("div", { className: "answer err", textContent: e.message })); }
    };

    // 라이브 DT 스트림 (없어도 페이지는 동작)
    let live = null;
    function connect() {
      const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/dt`);
      ws.onopen = () => { $("dot").className = "dot on"; $("conn").textContent = "DT 스트림 연결됨"; };
      ws.onclose = () => { $("dot").className = "dot"; $("conn").textContent = "DT 스트림 끊김 — 재연결 중"; setTimeout(connect, 2000); };
      ws.onmessage = (m) => {
        const p = JSON.parse(m.data).process || {};
        live = p;
        $("l-p").firstChild.textContent = p.laser_power ?? "---";
        $("l-v").firstChild.textContent = p.scan_speed ?? "---";
        $("l-w").firstChild.textContent = p.melt_width != null ? p.melt_width.toFixed(1) : "---";
        $("l-d").firstChild.textContent = p.melt_depth != null ? p.melt_depth.toFixed(1) : "---";
        $("l-m").textContent = p.prediction_model ?? "---";
        $("use-live").disabled = false;
      };
    }
    $("use-live").onclick = () => {
      if (!live) return;
      setConditions({ power_w: live.laser_power, speed_mm_s: live.scan_speed, spot_diameter_um: live.spot_diameter * 1000, layer_thickness_um: live.powder_layer_thickness_um });
      run();
    };
    connect();
  </script>
</body>
</html>
