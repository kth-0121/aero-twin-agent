<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LBFP Digital Twin</title>
  <style>
    html, body { margin:0; height:100%; background:#111; color:#eee; font-family:Arial,sans-serif; }
    #app { display:grid; grid-template-columns:1fr 320px; height:100%; }
    #scene { width:100%; height:100%; display:block; }
    #panel { padding:20px; background:#181818; overflow:auto; }
    h2 { margin-top:0; }
    .metric { padding:12px 0; border-bottom:1px solid #333; }
    .label { color:#999; font-size:12px; }
    .value { font-size:18px; margin-top:4px; }
    .ok { color:#55d187; }
    @media(max-width:800px){ #app{grid-template-columns:1fr;} #panel{position:absolute; right:0; top:0; width:260px; opacity:.94;} }
  </style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>
  <aside id="panel">
    <h2>LBFP Digital Twin</h2>
    <div class="metric"><div class="label">EQUIPMENT</div><div class="value" id="equipment">-</div></div>
    <div class="metric"><div class="label">STATE</div><div class="value ok" id="state">-</div></div>
    <div class="metric"><div class="label">POSITION</div><div class="value" id="position">-</div></div>
    <div class="metric"><div class="label">LASER POWER</div><div class="value" id="power">-</div></div>
    <div class="metric"><div class="label">SCAN SPEED</div><div class="value" id="speed">-</div></div>
    <div class="metric"><div class="label">MELT WIDTH</div><div class="value" id="width">-</div></div>
    <div class="metric"><div class="label">ASPECT RATIO</div><div class="value" id="ratio">-</div></div>
    <div class="metric"><div class="label">MELT AREA</div><div class="value" id="area">-</div></div>
  </aside>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

const canvas = document.querySelector('#scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);
const camera = new THREE.PerspectiveCamera(50, canvas.clientWidth/canvas.clientHeight, 0.01, 1000);
camera.position.set(2.8, 2.2, 2.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,0,0.4);
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));
const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(3,4,2); scene.add(light);
scene.add(new THREE.GridHelper(6, 30, 0x444444, 0x222222));

// Placeholder equipment model. Replace this group with the LBFP machine GLB later.
const machine = new THREE.Group();
const bed = new THREE.Mesh(new THREE.BoxGeometry(2.4,1.8,0.15), new THREE.MeshStandardMaterial({color:0x555555}));
bed.position.y = -0.075; machine.add(bed);
const frameMat = new THREE.MeshStandardMaterial({color:0x888888});
for (const x of [-1,1]) for (const z of [0.6,-0.6]) {
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.12,1.5,0.12), frameMat);
  post.position.set(x,0.75,z); machine.add(post);
}
const rail = new THREE.Mesh(new THREE.BoxGeometry(2.2,0.12,0.12), frameMat);
rail.position.y=1.5; machine.add(rail);
const head = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.18,0.28), new THREE.MeshStandardMaterial({color:0xdddddd}));
head.position.set(0,1.35,0); machine.add(head);
scene.add(machine);

const laser = new THREE.Mesh(new THREE.SphereGeometry(0.06,16,16), new THREE.MeshBasicMaterial({color:0xff3333}));
scene.add(laser);
const melt = new THREE.Mesh(new THREE.SphereGeometry(0.10,16,16), new THREE.MeshBasicMaterial({color:0xffaa33, transparent:true, opacity:.75}));
scene.add(melt);

function update(data){
  const p=data.position;
  laser.position.set(p.x, 0.12, p.y);
  melt.position.set(p.x, 0.08, p.y);
  document.querySelector('#equipment').textContent=data.equipment_id;
  document.querySelector('#state').textContent=data.state;
  document.querySelector('#position').textContent=`${p.x.toFixed(3)}, ${p.y.toFixed(3)}, ${p.z.toFixed(3)}`;
  document.querySelector('#power').textContent=`${data.process.laser_power.toFixed(0)} W`;
  document.querySelector('#speed').textContent=`${data.process.scan_speed.toFixed(0)} mm/s`;
  document.querySelector('#width').textContent=`${data.process.melt_width.toFixed(1)} μm`;
  document.querySelector('#ratio').textContent=data.process.aspect_ratio.toFixed(3);
  document.querySelector('#area').textContent=`${data.process.melt_area.toFixed(1)} μm²`;
}

const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${protocol}://${location.host}/ws/dt`);
ws.onmessage = e => update(JSON.parse(e.data));
ws.onopen = () => ws.send('subscribe');

function resize(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h,false);
}
window.addEventListener('resize',resize);
function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
animate();
</script>
</body>
</html>
